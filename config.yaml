# Futbolcu havuzu ayarları (src/build_players.py)

# 1970 ve sonrasında oynamış olanlar alınır. Kulüp kaydında tarih yoksa
# doğum yılı >= min_birth_year_fallback olanlar kabul edilir.
min_year: 1970
min_birth_year_fallback: 1950

# Süper Lig dışındaki liglerde oyuncunun en az kaç Wikipedia dilinde
# sayfası (sitelink) olmalı. Süper Lig için 0 = hepsi.
sitelink_threshold: 15

leagues:
  super_lig:      {qid: Q485568, name: "Süper Lig",     sitelink_threshold: 0}
  premier_league: {qid: Q9448,   name: "Premier League"}
  first_division: {qid: Q754839, name: "Football League First Division"}  # 1992 öncesi İngiltere
  la_liga:        {qid: Q324867, name: "La Liga"}
  serie_a:        {qid: Q15804,  name: "Serie A"}
  bundesliga:     {qid: Q82595,  name: "Bundesliga"}
  ligue_1:        {qid: Q13394,  name: "Ligue 1"}
  eredivisie:     {qid: Q167541, name: "Eredivisie"}
  primeira_liga:  {qid: Q182994, name: "Primeira Liga"}

# Wikidata'da lige bağlı görünmeyen ama eklenmesi gereken kulüpler (QID listesi).
extra_clubs: {}
#  super_lig: [Q12345]

# Bir SPARQL sorgusunda kaç kulüp / kaç oyuncu birlikte sorgulanır.
clubs_per_query: 8
players_per_query: 250

# Açık kaynak Türkçe kelime listesi (TDK tabanlı).
turkish_wordlist_url: https://raw.githubusercontent.com/mertemin/turkish-word-list/master/words.txt

# Tek başına soyad araması için minimum uzunluk (normalize edilmiş).
min_surname_length: 4

# Etiket/takma ad alınacak diller.
label_languages: [mul, tr, en, es, pt, it, de, fr, nl]
alias_languages: [mul, tr, en]
