name: Şarkı sözlerini tara

on:
  workflow_dispatch:
    inputs:
      sanatcilar:
        description: "İsteğe bağlı: virgülle ayrılmış sanatçılar (boşsa data/sanatcilar.txt kullanılır)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Çekilen sözler önbellekte tutulur; sonraki çalıştırmalar sadece yeni şarkıları indirir.
      - uses: actions/cache@v4
        with:
          path: cache
          key: sozler-${{ github.run_id }}
          restore-keys: sozler-

      - name: Sanatçı listesini girdiden al
        if: ${{ inputs.sanatcilar != '' }}
        run: echo "${{ inputs.sanatcilar }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' > data/sanatcilar.txt

      - name: Tara
        env:
          GENIUS_TOKEN: ${{ secrets.GENIUS_TOKEN }}
        run: python scripts/tara.py

      - name: Sonuçları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Tarama sonuçları güncellendi"
          git push
